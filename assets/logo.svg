<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 180">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="white" stop-opacity="0.0"/>
      <stop offset="60%" stop-color="white" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="prism-face-top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#90caf9" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1565c0" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="prism-face-bot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1565c0" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#42a5f5" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="480" height="180" fill="#0a0f1e" rx="12"/>

  <!-- White input beam -->
  <polygon points="0,86 118,88 118,92 0,94"
           fill="url(#beam)" filter="url(#glow-soft)"/>

  <!-- Prism body: apex (118,90), top-right (310,18), bottom-right (310,162) -->
  <!-- Top face -->
  <polygon points="118,90 310,18 310,90"
           fill="url(#prism-face-top)" opacity="0.7"/>
  <!-- Bottom face -->
  <polygon points="118,90 310,90 310,162"
           fill="url(#prism-face-bot)" opacity="0.6"/>

  <!-- Prism outline -->
  <polygon points="118,90 310,18 310,162"
           fill="none"
           stroke="#64b5f6" stroke-width="1.6" stroke-linejoin="round" opacity="0.9"/>

  <!-- Subtle inner highlight on top edge -->
  <line x1="119" y1="90" x2="309" y2="20"
        stroke="rgba(200,230,255,0.35)" stroke-width="1"/>

  <!-- ── Spectrum rays (exit from right face x=310, spread to right edge) ── -->
  <!-- Red -->
  <line x1="310" y1="38"  x2="480" y2="0"
        stroke="#ff4444" stroke-width="4.5" filter="url(#glow)" opacity="0.92"/>
  <!-- Orange -->
  <line x1="310" y1="60"  x2="480" y2="38"
        stroke="#ff8c00" stroke-width="4.5" filter="url(#glow)" opacity="0.92"/>
  <!-- Yellow -->
  <line x1="310" y1="80"  x2="480" y2="76"
        stroke="#ffd740" stroke-width="4.5" filter="url(#glow)" opacity="0.95"/>
  <!-- Green -->
  <line x1="310" y1="100" x2="480" y2="114"
        stroke="#69f0ae" stroke-width="4.5" filter="url(#glow)" opacity="0.92"/>
  <!-- Blue -->
  <line x1="310" y1="120" x2="480" y2="148"
        stroke="#40c4ff" stroke-width="4.5" filter="url(#glow)" opacity="0.92"/>
  <!-- Indigo -->
  <line x1="310" y1="138" x2="480" y2="178"
        stroke="#7c4dff" stroke-width="4"   filter="url(#glow)" opacity="0.88"/>
  <!-- Violet -->
  <line x1="310" y1="152" x2="436" y2="180"
        stroke="#ea80fc" stroke-width="3.5" filter="url(#glow)" opacity="0.82"/>

  <!-- "PRISM" wordmark -->
  <text x="118" y="170"
        font-family="'Segoe UI', system-ui, sans-serif"
        font-size="15" font-weight="700" letter-spacing="5"
        fill="#90caf9" opacity="0.85">PRISM</text>
</svg>
